<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Overkill Reminder - 催死你小人仔 (v2.0 Canvas)</title>
  <meta name="theme-color" content="#3A281E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mobile-frame" id="appFrame">
    
    <!-- 頂部打工養仔狀態 Dashboard -->
    <header class="care-header">
      <div class="care-top-row">
        <div class="boy-title">
          <div class="boy-avatar-icon">👦</div>
          <div class="boy-name-block">
            <h1>困在手機的小人仔</h1>
            <p id="careStatusText">等你做完嘢先有飯食 🍱</p>
          </div>
        </div>

        <div class="stats-group">
          <div class="stat-pill" title="主人打工賺到的金幣">🪙 <span id="coinDisplay">120</span></div>
          <div class="stat-pill" title="連續準時打卡天數">🔥 <span id="streakDisplay">3</span></div>
          <div class="stat-pill" id="soundBtn" onclick="toggleAudio()" style="cursor: pointer;" title="音效開關">🔊 開</div>
        </div>
      </div>

      <!-- 養育數值條 -->
      <div class="meter-row">
        <div class="meter-item">
          <span>🍱 飽食度</span>
          <div class="meter-track">
            <div class="meter-fill fill-hunger" id="hungerFill" style="width: 70%;"></div>
          </div>
        </div>
        <div class="meter-item">
          <span>💖 開心度</span>
          <div class="meter-track">
            <div class="meter-fill fill-happy" id="happyFill" style="width: 85%;"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- 方案 B 矩陣模式切換 (證明共用同一套 Character Engine) -->
    <nav class="matrix-tabs">
      <button class="matrix-tab-btn active" id="tabReminder" onclick="switchMatrixMode('REMINDER')">
        ⏰ Overkill 催促提醒
      </button>
      <button class="matrix-tab-btn" id="tabDiary" onclick="switchMatrixMode('DIARY')">
        📖 晚間日記 (Diary 預覽)
      </button>
    </nav>

    <!-- Overkill 任務與計時卡片 -->
    <section class="task-card" id="reminderCard">
      <div class="task-input-row">
        <input type="text" class="task-input" id="taskInput" value="今晚 8:00 完成工作 / 溫習功課" title="點擊編輯任務">
        <div class="timer-badge" id="timerDisplay">⏰ 00:10</div>
      </div>

      <!-- 快速手感測試工具列 (直接驗證小人仔各項動作與手感) -->
      <div class="quick-test-bar">
        <button class="test-btn" onclick="CharacterEngine.triggerTimeUp()">⏰ 時間到</button>
        <button class="test-btn danger" onclick="triggerTapSimulation()">👆 試撳(走位)</button>
        <button class="test-btn danger" onclick="CharacterEngine.triggerClone()">👥 召喚分身</button>
        <button class="test-btn success" onclick="CharacterEngine.completeTask()">🎉 模擬完成</button>
        <button class="test-btn" onclick="cycleOutfit()">👔 換裝</button>
      </div>
    </section>

    <!-- 核心 Canvas 60FPS 動畫與物理舞台 -->
    <main class="canvas-wrapper">
      <canvas id="characterCanvas"></canvas>
    </main>

    <!-- Diary 模式輸入面板 (切換至 Diary 時展開) -->
    <section class="diary-container" id="diaryPanel">
      <div style="font-size: 11px; color: var(--text-muted); display:flex; justify-content:space-between;">
        <span>📝 小人仔正坐在窗邊，等聽你分享今天外面的故事</span>
        <span id="diaryProgressText">距第 20 次小禮物差 13 次 🎁</span>
      </div>
      <textarea class="diary-textarea" id="diaryText" placeholder="同我講下啦……今日返工/返學點呀？有冇食好嘢？定係遇到挫折好辛苦？我聽緊㗎……"></textarea>
      <button class="btn-diary-submit" onclick="submitDiary()">
        ✨ 送出日記給小男孩 (觸發情感反饋)
      </button>
    </section>

    <!-- 底部操作列 (完成離開 vs 安全退出) -->
    <footer class="bottom-bar" id="reminderFooter">
      <div class="action-row">
        <button class="btn-done" onclick="CharacterEngine.completeTask()">
          <span>✅</span>
          <span>我做完啦！(打卡離開)</span>
        </button>
        <button class="btn-snooze" onclick="CharacterEngine.safeExit()">
          <span>✋ 放過我 / 聽電話</span>
        </button>
      </div>

      <div class="footer-status-row">
        <span>Engine 狀態：<b id="engineStatusTag" style="color: var(--text-main);">WAITING</b></span>
        <span style="color: var(--accent-blue); font-weight:700;">HTML5 Canvas 60FPS • 觸控隨機走位</span>
      </div>
    </footer>

    <!-- 完成任務後的乾淨清爽覆蓋層 -->
    <div class="exit-overlay" id="exitOverlay">
      <div class="exit-box">
        <div class="exit-icon">🌟</div>
        <div class="exit-title">主人順利完成！</div>
        <div class="exit-desc">
          小人仔心滿意足咁去咗食大餐 🍱<br>
          「好啦～任務完成，我走喇！拜拜～👋」
        </div>
        <button class="btn-done" style="width: 100%;" onclick="CharacterEngine.resetTask()">
          🔄 再設下一個任務
        </button>
      </div>
    </div>

    <!-- 浮動 Toast 提示 -->
    <div class="toast-bar" id="toast"></div>

  </div>

  <!-- 模組化 JavaScript 程式碼 -->
  <script src="sound-effects.js"></script>
  <script src="canvas-character.js"></script>
  <script src="character-engine.js"></script>
  <script>
    let stage = null;
    const outfits = ['hoodie', 'rainy', 'school'];
    let outfitIdx = 0;

    window.addEventListener('DOMContentLoaded', () => {
      // 1. 初始化 Canvas 動畫物理舞台
      stage = new CanvasCharacterStage('characterCanvas');
      stage.start();

      // 2. 初始化核心共用 Character Engine
      CharacterEngine.init(stage);

      // 3. 註冊 PWA Service Worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });

    function toggleAudio() {
      const enabled = SoundEffects.toggleSound();
      document.getElementById('soundBtn').innerText = enabled ? '🔊 開' : '🔇 關';
      CharacterEngine.showToast(enabled ? '🔊 音效已開啟' : '🔇 音效已靜音');
    }

    function triggerTapSimulation() {
      if (stage && stage.boys.length > 0) {
        const targetBoy = stage.boys[0];
        CharacterEngine.handleBoyTap(targetBoy, targetBoy.x, targetBoy.y);
      }
    }

    function cycleOutfit() {
      outfitIdx = (outfitIdx + 1) % outfits.length;
      CharacterEngine.changeOutfit(outfits[outfitIdx]);
    }

    // 方案 B 矩陣模式切換
    function switchMatrixMode(mode) {
      CharacterEngine.mode = mode;
      const tabReminder = document.getElementById('tabReminder');
      const tabDiary = document.getElementById('tabDiary');
      const reminderCard = document.getElementById('reminderCard');
      const reminderFooter = document.getElementById('reminderFooter');
      const diaryPanel = document.getElementById('diaryPanel');

      if (mode === 'REMINDER') {
        tabReminder.classList.add('active');
        tabDiary.classList.remove('active');
        reminderCard.style.display = 'block';
        reminderFooter.style.display = 'flex';
        diaryPanel.style.display = 'none';
        CharacterEngine.resetTask();
        CharacterEngine.showToast('⏰ 切換至 Overkill Reminder 模式');
      } else {
        tabReminder.classList.remove('active');
        tabDiary.classList.add('active');
        reminderCard.style.display = 'none';
        reminderFooter.style.display = 'none';
        diaryPanel.style.display = 'flex';
        
        // 日記模式：小人仔安靜抱膝坐在窗邊等聽故事
        stage.boys = [stage.mainBoy];
        stage.mainBoy.setPoseAndMood('sitting', 'waiting', '「今日外面世界發生咗咩事呀？講我知啦……」');
        CharacterEngine.state = 'DIARY_WAITING';
        CharacterEngine.updateCareUI();
        CharacterEngine.showToast('📖 切換至 Diary 模式 (共用 Engine)');
      }
    }

    function submitDiary() {
      const input = document.getElementById('diaryText');
      const reply = CharacterEngine.analyzeDiaryEntry(input.value);
      if (stage.mainBoy) {
        stage.mainBoy.setPoseAndMood('sitting', 'happy', reply);
      }
      input.value = '';
    }
  </script>
</body>
</html>
